name: Contrato de datos Netflix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  contrato-de-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements_streamlit.txt
      - name: Instalar dependencias mínimas
        run: python -m pip install 'pandas>=2.0,<3'
      - name: Validar CSV publicado (fallo = bloquea el job)
        run: python scripts/validar_contrato.py --csv netflix_customer_churn.csv
      - name: Validar exportaciones de métricas y segmentos
        run: python scripts/validar_exportaciones.py
      - name: Ejecutar pruebas de regresión
        run: python -m unittest discover -s tests -v
      - name: Comprobar sintaxis de integración
        run: python -m py_compile validacion_datos.py scripts/validar_contrato.py scripts/integrar_app.py scripts/validar_exportaciones.py
