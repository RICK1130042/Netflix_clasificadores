name: Documentación viva
on:
  push:
    branches: [main, 'revision/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==4.0.0
      - run: python scripts/publicar_documentacion.py _site --sha "$GITHUB_SHA"
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site
  publicar:
    if: github.ref == 'refs/heads/main'
    needs: generar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar HTML en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
